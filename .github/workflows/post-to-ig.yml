name: Post daily briefing to Instagram

on:
  # 正式排程:GitHub Actions 內建 schedule 延遲/跳過不可靠,改由外部 cron
  # (cron-job.org)在 00:05 UTC = 08:05 台北準時打 repository_dispatch 觸發,
  # 不帶 client_payload,此 workflow 收到後照樣走 Gmail fetch 抓當天的信。
  repository_dispatch:
    types: [post_briefing]
  # 方便手動測試:去 repo 的 Actions 頁籤按 "Run workflow"
  workflow_dispatch:
    inputs:
      payload_json:
        description: "測試用 payload(貼上完整 JSON 字串,留空則跟 schedule 一樣去讀信)"
        required: false

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch payload from Gmail
        if: (github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) == 'null') || (github.event_name == 'workflow_dispatch' && github.event.inputs.payload_json == '')
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SELF_ADDRESS: ${{ secrets.GMAIL_SELF_ADDRESS }}
        run: |
          python3 scripts/fetch_briefing_email.py --out payload.json
          cat payload.json

      - name: Write payload.json from manual/dispatch input
        if: (github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) != 'null') || (github.event_name == 'workflow_dispatch' && github.event.inputs.payload_json != '')
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "$MANUAL_PAYLOAD" > payload.json
          else
            echo "$DISPATCH_PAYLOAD" > payload.json
          fi
          cat payload.json

      - name: Render carousel slides
        run: |
          python3 scripts/render_card.py --payload payload.json --out-dir output \
            --template card_template_1.html --template card_template_2.html --template card_template_3.html

      - name: Commit images to repo
        id: commit_image
        run: |
          git config user.name "ig-auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p assets
          TS=$(date +%Y%m%d-%H%M%S)
          cp output/slide-1.png "assets/card-$TS-1.png"
          cp output/slide-2.png "assets/card-$TS-2.png"
          cp output/slide-3.png "assets/card-$TS-3.png"
          git add assets/
          git commit -m "chore: add daily IG card $(date +%Y-%m-%d)"
          git push

      - name: Resolve public URLs via jsDelivr and wait for CDN propagation
        id: image_url
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          FILE_PATHS=$(git diff --name-only HEAD~1 HEAD | grep assets/)

          URLS=""
          PATHS_OUT=""
          for FILE_PATH in $FILE_PATHS; do
            JSDELIVR_URL="https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/${FILE_PATH}"
            # 強制 purge jsDelivr 快取,確保抓到最新這張圖
            curl -sS "https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/${FILE_PATH}" || true

            READY=0
            for i in $(seq 1 20); do
              STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$JSDELIVR_URL")
              if [ "$STATUS" = "200" ]; then
                echo "jsDelivr ready for $FILE_PATH after $((i * 5))s"
                READY=1
                break
              fi
              echo "attempt $i for $FILE_PATH: status $STATUS, retrying in 5s..."
              sleep 5
            done
            if [ "$READY" != "1" ]; then
              echo "jsDelivr never returned 200 for $FILE_PATH within 100s, giving up" >&2
              exit 1
            fi

            URLS="$URLS$JSDELIVR_URL"$'\n'
            PATHS_OUT="$PATHS_OUT$FILE_PATH"$'\n'
          done

          {
            echo "urls<<EOF"
            printf '%s' "$URLS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "file_paths<<EOF"
            printf '%s' "$PATHS_OUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract caption from payload
        id: caption
        run: |
          CAPTION=$(python3 -c "import json;print(json.load(open('payload.json')).get('caption',''))")
          {
            echo "text<<EOF"
            echo "$CAPTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish carousel to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          IMAGE_ARGS=()
          while IFS= read -r url; do
            [ -n "$url" ] && IMAGE_ARGS+=(--image-url "$url")
          done <<< "${{ steps.image_url.outputs.urls }}"

          python3 scripts/publish_ig.py "${IMAGE_ARGS[@]}" \
            --caption "${{ steps.caption.outputs.text }}"

      - name: Remove published cards from assets/
        if: success()
        run: |
          git config user.name "ig-auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          while IFS= read -r FILE_PATH; do
            [ -n "$FILE_PATH" ] && git rm "$FILE_PATH"
          done <<< "${{ steps.image_url.outputs.file_paths }}"
          git commit -m "chore: remove published IG card $(date +%Y-%m-%d)"
          git pull --rebase
          git push
