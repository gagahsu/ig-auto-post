name: Refresh Instagram long-lived token

on:
  schedule:
    # 每個月的 1 號和 16 號跑一次(遠低於 60 天效期,也滿足「至少 24 小時未刷新過」的限制)
    - cron: "0 3 1,16 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pynacl

      - name: Refresh token and update secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT_FOR_SECRETS: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: python3 scripts/refresh_ig_token.py
