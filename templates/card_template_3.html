<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1350px;
    background-color: #efe9e1;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, sans-serif;
  }
  .outer {
    width: 1080px; height: 1350px;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
    padding: 40px;
  }
  .card {
    width: 100%; height: 100%;
    background-color: #fcf9f2;
    border: 7px solid #232724;
    border-radius: 40px;
    box-sizing: border-box;
    padding: 48px 52px;
    display: flex;
    flex-direction: column;
  }
  .title {
    text-align: center;
    font-size: 46px;
    font-weight: 900;
    color: #232724;
  }
  .slide-tag {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #888;
    border-bottom: 4px dashed #232724;
    padding-bottom: 30px;
    margin-bottom: 36px;
  }
  .focus-box {
    background: #fef08a; border: 4px solid #232724; border-radius: 28px;
    padding: 36px 38px; font-size: 40px; line-height: 1.6; flex-grow: 1;
  }
  .focus-title { font-weight: 900; font-size: 42px; margin-bottom: 20px; color: #1f2937; }
  .footer { text-align: right; font-size: 22px; color: #777; margin-top: 20px; }
</style>
</head>
<body>
  <div class="outer">
    <div class="card">
      <div class="title">彡 台股盤前速報 ｜ {{ date }} ミ</div>
      <div class="slide-tag">3 / 3 ｜ 族群與開盤觀測</div>

      <div class="focus-box fit-text">
        <div class="focus-title">📌 重點族群 &amp; 開盤觀測</div>
        {{ groups_note | safe }}
      </div>

      <div class="footer">個人盤前筆記 ｜ 非投資建議</div>
    </div>
  </div>
</body>
</html>
