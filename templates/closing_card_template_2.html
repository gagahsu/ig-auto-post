<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1350px;
    background-color: #efe9e1;
    font-family: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
  }
  .outer {
    width: 1080px; height: 1350px;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
    padding: 40px;
  }
  .card {
    width: 100%; height: 100%;
    background-color: #fcf9f2;
    border: 7px solid #232724;
    border-radius: 40px;
    box-sizing: border-box;
    padding: 48px 52px;
    display: flex;
    flex-direction: column;
  }
  .title {
    text-align: center;
    font-size: 46px;
    font-weight: 900;
    color: #232724;
  }
  .slide-tag {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #888;
    border-bottom: 4px dashed #232724;
    padding-bottom: 30px;
    margin-bottom: 32px;
  }
  .group-box {
    border: 4px solid #232724; border-radius: 28px; background: #fff;
    padding: 24px 28px; margin-bottom: 24px; font-size: 27px; line-height: 1.5;
  }
  .group-box.leading { border-color: #dc2626; }
  .group-box.weak { border-color: #059669; }
  .group-title { font-weight: 900; font-size: 30px; margin-bottom: 10px; color: #232724; }
  .group-title.leading { color: #dc2626; }
  .group-title.weak { color: #059669; }
  .notes-box {
    background: #fef08a; border: 4px solid #232724; border-radius: 28px;
    padding: 26px 30px; font-size: 27px; line-height: 1.55; flex-grow: 1;
  }
  .notes-title { font-weight: 900; font-size: 31px; margin-bottom: 12px; color: #1f2937; }
  .footer { text-align: right; font-size: 22px; color: #777; margin-top: 20px; }
</style>
</head>
<body>
  <div class="outer">
    <div class="card">
      <div class="title">彡 台股盤後統整 ｜ {{ date }} ミ</div>
      <div class="slide-tag">2 / 2 ｜ 族群與明日觀測</div>

      <div class="group-box leading fit-text">
        <div class="group-title leading">領漲族群</div>
        {{ leading_groups | safe }}
      </div>

      <div class="group-box weak fit-text">
        <div class="group-title weak">弱勢/整理</div>
        {{ weak_groups | safe }}
      </div>

      <div class="notes-box fit-text">
        <div class="notes-title">✏️ 盤後重點 &amp; 明日觀測</div>
        {{ notes | safe }}
      </div>

      <div class="footer">個人盤後筆記 ｜ 非投資建議</div>
    </div>
  </div>
</body>
</html>
