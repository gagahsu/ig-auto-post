<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1350px;
    background-color: #efe9e1;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, sans-serif;
  }
  .outer {
    width: 1080px; height: 1350px;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
    padding: 40px;
  }
  .card {
    width: 100%; height: 100%;
    background-color: #fcf9f2;
    border: 7px solid #232724;
    border-radius: 40px;
    box-sizing: border-box;
    padding: 48px 52px;
    display: flex;
    flex-direction: column;
  }
  .title {
    text-align: center;
    font-size: 46px;
    font-weight: 900;
    color: #232724;
  }
  .slide-tag {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #888;
    border-bottom: 4px dashed #232724;
    padding-bottom: 30px;
    margin-bottom: 36px;
  }
  .content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
  .group-box {
    border: 4px solid #232724; border-radius: 28px; background: #fff;
    padding: 32px 36px; font-size: 36px; line-height: 1.6;
  }
  .group-box.leading { border-color: #dc2626; }
  .group-box.weak { border-color: #059669; }
  .group-title { font-weight: 900; font-size: 40px; margin-bottom: 14px; color: #232724; }
  .group-title.leading { color: #dc2626; }
  .group-title.weak { color: #059669; }
  .footer { text-align: right; font-size: 22px; color: #777; margin-top: 20px; }
</style>
</head>
<body>
  <div class="outer">
    <div class="card">
      <div class="title">彡 台股盤後統整 ｜ {{ date }} ミ</div>
      <div class="slide-tag">2 / 3 ｜ 領漲與弱勢族群</div>

      <div class="content">
        <div class="group-box leading fit-text">
          <div class="group-title leading">領漲族群</div>
          {{ leading_groups | safe }}
        </div>

        <div class="group-box weak fit-text">
          <div class="group-title weak">弱勢/整理</div>
          {{ weak_groups | safe }}
        </div>
      </div>

      <div class="footer">個人盤後筆記 ｜ 非投資建議</div>
    </div>
  </div>
</body>
</html>
